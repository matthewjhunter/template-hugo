name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/

  link-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public/

      - uses: infodancer/hugo-link-checker@v1
        with:
          site-path: ./public
          check-external-links: true
          fail-on-broken-links: true
          output-format: text
